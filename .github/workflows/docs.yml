name: Deploy docs to GitHub Pages

# Runs after "Python package" succeeds on a push to main and publishes the
# coverage report that run uploaded, instead of running the test suite a second
# time (it was 349 of the 3001 minutes billed in October 2026). A manual
# dispatch has no such run: it runs the tests itself, as before.
on:
  workflow_run:
    workflows: ["Python package"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read   # download the coverage artifact of the triggering run

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # a pull request or tag run of the checks must not deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      # the commit the checks ran on, not the head of main when this job starts
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download coverage report
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: docs/public/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-python@v5
        if: github.event_name != 'workflow_run'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run pytest with coverage
        if: github.event_name != 'workflow_run'
        run: |
          pip install -e ".[dev]"
          pytest

      # both files are git-ignored: without them the badge and the coverage page go stale
      - name: Check coverage report
        run: test -s docs/public/coverage.json && test -s docs/public/coverage-badge.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build VitePress site
        working-directory: docs
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
