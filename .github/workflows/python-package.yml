# Lint, test, and smoke-build SHORE across the supported Python matrix.
#
# Billed minutes (private repo): a push runs the Linux jobs only. The macOS/Windows
# smoke matrix (12 s of work billed 10x/2x, each job rounded up to a whole minute:
# 48% of the October 2026 quota) runs on release tags and on manual dispatch.
name: Python package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# a newer push to the same ref supersedes the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # lint, tests and the Linux smoke test in one job: each job costs a runner
    # start-up and is billed rounded up to a whole minute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + test deps
        run: pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: pytest
      # docs.yml (workflow_run) publishes this coverage instead of rerunning the suite
      - name: Upload coverage report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: docs/public/coverage*.json
          if-no-files-found: error
          retention-days: 1
      - name: Smoke-test shore CLI
        run: shore --help
      # reported even when the tests fail
      - name: Lint
        if: ${{ !cancelled() }}
        run: ruff check src/ tests/
      - name: Format check
        if: ${{ !cancelled() }}
        run: ruff format --check src/ tests/
      - name: Frozen acceptance specs unmodified (ADR 0005, 0007-0048)
        if: ${{ !cancelled() }}
        run: python scripts/check_spec.py

  test-cad:
    # OCCT backend (shore[cad], ~70 MB of wheels): kept out of the default job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package + test + CAD deps
        run: pip install -e ".[dev,cad]"
      - name: Run geometry tests
        run: pytest tests/test_geometry.py tests/test_geometry_occt.py tests/test_cad_pipeline.py tests/spec/test_surface_tfi_cad.py
          tests/spec/test_loop_corners_cad.py tests/spec/test_associate.py tests/test_association.py --no-cov

  test-gui:
    # the GUI (shore[gui], ~90 MB of wheels; ADR 0037) headless: Qt's offscreen
    # platform and Mesa's software Vulkan adapter (lavapipe) for wgpu
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install software Vulkan and Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install package + test + GUI + CAD deps (ADR 0038's CAD cases)
        run: pip install -e ".[dev,gui,cad]"
      - name: Run GUI tests
        run: pytest tests_gui --no-cov

  build:
    # release tags and manual runs only: see the note at the top
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Smoke-test shore CLI
        env:
          # Windows' default cp1252 stdout codec can't encode the Rich-style
          # ✓/✗ glyphs SHORE prints from `shore check` and friends; force
          # UTF-8 so the smoke test on windows-latest runs cleanly.
          PYTHONIOENCODING: utf-8
        run: |
          python --version
          pip list
          shore --help

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    permissions:
      contents: read    # required for actions/checkout
      id-token: write   # required for OIDC Trusted Publisher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
