[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shore"
version = "0.1.0"
description = "SHORE — Structured Hyperbolic Overlapping Remeshing Engine"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "trimesh>=4.0",
    "rtree>=1.0",
    "scipy>=1.12",
    "typer>=0.12",
    "rich>=13.0",
]
authors = [{ name = "Stefano Zaghi", email = "stefano.zaghi@gmail.com" }]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "pyvista",
]
vis = [
    "pyvista",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C4", "RUF"]

[project.scripts]
shore = "shore.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=shore --cov-report=term-missing"

[tool.coverage.run]
source = ["shore"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
