[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shore-mesh"
version = "0.4.0"
description = "SHORE — Structured Hyperbolic Overlapping Remeshing Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Stefano Zaghi", email = "stefano.zaghi@gmail.com" },
    { name = "Andrea Di Mascio", email = "andrea.dimascio@univaq.it" },
]
keywords = ["mesh", "cfd", "chimera", "overset", "structured-grid", "hyperbolic-mesh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "trimesh>=4.0",
    "rtree>=1.0",
    "networkx>=3.0",  # trimesh.repair.fix_normals (load_stl hygiene)
    "scipy>=1.12",
    "typer>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage      = "https://szaghi.github.io/shore/"
Documentation = "https://szaghi.github.io/shore/"
Repository    = "https://github.com/szaghi/shore"
Issues        = "https://github.com/szaghi/shore/issues"
Changelog     = "https://github.com/szaghi/shore/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "pyvista",
    "h5py",
    "pycgns",  # ADR 0035: an independent CGNS reader for the export specs
]
vis = [
    "pyvista",
]
cad = [
    "build123d>=0.13",
]
cgns = [
    "h5py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C4", "RUF"]

[project.scripts]
shore = "shore.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=shore --cov-report=term-missing"

[tool.coverage.run]
source = ["shore"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
