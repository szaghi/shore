# SHORE split config — paired k-split across cubed-sphere sub-blocks
# ===================================================================
#
# Used by ``examples/04-split/split_cubed_sphere.py`` to subdivide ALL SIX
# cubed-sphere blocks (4 equatorial sub-blocks + 2 polar caps) along the
# wall-normal (k) axis at the same vertex index.
#
# Why all six, on k, at the same index:
#   * j-periodic ring: each sub_q shares its j_lo with sub_(q-1)'s j_hi, so
#     splitting only some sub-blocks would break the SHARED ring.
#   * cap<->sub DIRICHLET seam: the cap-equator seam is PERPENDICULAR to k, so
#     a k-split of a sub-block multiplies its cap-facing face into N chunks.
#     The cap MUST be co-split on k at the same index so each chunk pairs 1:1;
#     otherwise the splitter rejects the unmatched DIRICHLET seam (a sub k-cut
#     against a whole cap is a multi-chunk-to-single-cap mismatch).
# k is the only safe split axis here: the i/j faces are the SHARED/DIRICHLET
# topology seams, k is WALL (k_lo) / FREE (k_hi).
#
# Run with:
#
#     python examples/04-split/split_cubed_sphere.py --config examples/04-split/config_split_cubed_sphere.toml
#
# or via the CLI directly (after generating a cubed-sphere mesh):
#
#     shore mesh sphere.stl --ni 30 --nj 40 --nk 12 -o sphere
#     shore split sphere_*.geo -c examples/04-split/config_split_cubed_sphere.toml -o sphere_split

version = 1
kind    = "split"

# Mid-block cut on the wall-normal axis: nk = 12 → cut at vertex 6.
# Adjust to match your own (ni, nj, nk) — the splitter checks the
# index is in range and raises if not.

[[splits]]
label = "sub0"
axis  = "k"
at    = [6]

[[splits]]
label = "sub1"
axis  = "k"
at    = [6]

[[splits]]
label = "sub2"
axis  = "k"
at    = [6]

[[splits]]
label = "sub3"
axis  = "k"
at    = [6]

[[splits]]
label = "cap_north"
axis  = "k"
at    = [6]

[[splits]]
label = "cap_south"
axis  = "k"
at    = [6]
